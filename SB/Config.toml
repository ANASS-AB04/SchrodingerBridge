bundle1      = "results/bump/h0.025/M2.50_HLLC_MUSCL_SRK2_t4.00.npz"
mesh         = "meshes/bump/bump_h0.025.npy"
mach0_inlet  = 2.0   # freestream Mach for bundle0
mach1_inlet  = 2.5   # freestream Mach for bundle1
ref_bundles = [
    "results/bump/h0.025/M2.05_HLLC_MUSCL_SRK2_t4.00.npz",
    "results/bump/h0.025/M2.10_HLLC_MUSCL_SRK2_t4.00.npz",
    "results/bump/h0.025/M2.15_HLLC_MUSCL_SRK2_t4.00.npz",
    "results/bump/h0.025/M2.20_HLLC_MUSCL_SRK2_t4.00.npz",
    "results/bump/h0.025/M2.25_HLLC_MUSCL_SRK2_t4.00.npz",
    "results/bump/h0.025/M2.30_HLLC_MUSCL_SRK2_t4.00.npz",
    "results/bump/h0.025/M2.35_HLLC_MUSCL_SRK2_t4.00.npz",
    "results/bump/h0.025/M2.40_HLLC_MUSCL_SRK2_t4.00.npz",
    "results/bump/h0.025/M2.45_HLLC_MUSCL_SRK2_t4.00.npz",
]