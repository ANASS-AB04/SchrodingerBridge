# ---------------------------------------------------------------------------
# SB execution parameters — this file is the only source of run configuration
# (SB/main.py takes no command-line arguments).
# ---------------------------------------------------------------------------
[run]
case       = "2d_mach_interpolation"
output_dir = "outputs"

[run.1d]
# γ=0.05 gives σ=√(2γ)≈0.316, well-resolved on the 1D grid (dx≈0.03).
# Lower γ → SB approaches OT; higher γ → SB approaches OU diffusion.
gamma    = 0.005
num_iter = 1000

[run.2d]
gamma    = 0.005
num_iter = 1000

# ---------------------------------------------------------------------------
# 2D Mach interpolation — shared parameters
# ---------------------------------------------------------------------------
[run.mach]

# Switch between "diamond" and "bump" to change the active test case.
case       = "diamond"

gamma_sb   = 0.005
# γ-annealing (ε-scaling): DECREASING list of γ for the IPFP, each stage
# warm-started from the previous (f,g).  Reaches small γ that diverge cold.
# Last entry = target γ used downstream.  Empty [] → single gamma_sb above.
#   • reference_drift = "null"    → keep γ_min ≈ 0.005: the pure-heat bridge is
#     ill-conditioned near the OT limit and the IPFP will NOT converge much below
#     this on the eig marginal (res stalls, kernel collapses → garbage maps).
#   • reference_drift = "oblique" → the drift conditions the bridge, so you can
#     anneal down to [0.0003, 0.0002, 0.0001] (that is the point of the drift).
gamma_sb_schedule = [0.02, 0.01, 0.005]

# Reference drift β(t,x) conditioning the bridge (referrence_drift.tex).
#   "null"      — β≡0, pure-heat bridge (default; identical to previous behaviour)
#   "oblique"   — analytic θ-β-M diamond drift (windowed rigid shock rotations)
#   "ffd"       — data-driven drift from FFD registration of the two marginals
#   "SBsquared" — BOOTSTRAPPED / self-conditioned drift.  β is not supplied from
#                 outside at all: stage 0 of the γ-anneal is a pure-heat bridge,
#                 and each later stage takes β from the PREVIOUS stage's own SB
#                 solution, β_{k+1} = b^(k) = β^(k) + 2γ_k ∇g_t  (frozen at t=0.5,
#                 the same collapse "oblique" uses).  The true SB solution is a
#                 fixed point of this map (β optimal ⇒ ∇g→0 ⇒ β'=β), so watch
#                 drift.beta_delta_history in metrics.json: decay down the ladder
#                 means it is converging.  REQUIRES ≥2 entries in
#                 gamma_sb_schedule — with one stage it degenerates to "null".
#   "SBsquared_exact" — the same bootstrap, but carrying the FULL time-dependent
#                 β(t) through the kernel instead of collapsing it to t=0.5.  Each
#                 stage recovers b_t at drift_bootstrap_nt uniform times.  Q walks
#                 that stack BACKWARD in SB time and Q† FORWARD; the mirroring is
#                 what keeps ⟨Qu,v⟩_A = ⟨u,Q†v⟩_A exact (verified to 7e-15, and a
#                 deliberately un-mirrored version fails it by 183%).
# For every mode except "null", the IPFP kernel becomes the advection-diffusion
# semigroup Q/Q†.
reference_drift = "ffd"

# "SBsquared" only: heat-smooth the recovered drift before feeding it to the next
# stage.  The drift comes from compute_scalar_gradient_LSQ(g_t), and that
# cell-to-cell gradient noise is exactly why the barycentric CDI was built
# gradient-free — over a dozen stages it would compound.  Uses smooth_gamma /
# smooth_t below (σ = √(2γt) ≈ 0.014).  Set false to A/B the noise question.
drift_bootstrap_smooth = true

# "SBsquared_exact" only: number of uniform SB times at which b_t is sampled to
# build the beta(t) stack the kernel carries.  Each costs one extra semigroup
# solve per annealing stage (~3% overhead beside the IPFP itself).  Defaults to
# n_frames.  Q indexes this stack BACKWARD in SB time and Qdagger FORWARD — see
# the DIRECTION TRAP note in advdiff_solver.py.
drift_bootstrap_nt = 11

# Bootstrap SEEDING (both SBsquared modes).  "null" = original behaviour: stage 0
# is a pure-heat bridge whose recovered drift (2γ∇g at γ≈0.2) is huge and
# void-dominated — the measured cause of the mid-ladder failure (worst drift from
# 5e-2 to 2e-3, worse than Linear at 2e-2).  "ffd" seeds β from the registration
# (reusing the control's, no second registration); "oblique" from the analytic
# θ-β-M drift.  drift_bootstrap_start_gamma holds the seed FIXED until the next
# stage's γ drops strictly below it: inf = bootstrap from the very start
# (original), 1e-3 = the data-recommended switch (ffd-drift is at or near best
# down to 1e-3; the bootstrap only wins below 5e-4), 0.0 = never engage (a seeded
# run is then exactly a drift_ffd run — the degeneracy check).
drift_bootstrap_seed        = "null"
drift_bootstrap_start_gamma = inf

# "SBsquared_exact" only: sample the β(t) stack on [clip, 1-clip] instead of
# [0, 1].  b_t = 2γ∇g_t with g_t = log Q_{1-t}[e^g], so at t=1 the semigroup is
# the IDENTITY and g_t is the RAW log-potential — its gradient across the
# void/ridge boundary is enormous on a log scale.  Measured on a synthetic
# void+ridge potential:  t=0.5 → |b|=1.79, t=0.9 → 3.70, t=1.0 → 13.76.
# |β|_max sets the advective CFL and Péclet for the WHOLE kernel, so that one
# slice poisons every stage (a heat-seeded exact run hit |β|=12.96 vs the frozen
# mode's 2.4).  The kernel interpolates the stack by index, so clipping clamps
# the end slices to the nearest interior value.  Measured A/B (exact+ffd seed,
# 3-stage smoke): clip 0.0 -> |b|=2.76, L2=3.86e-3;  0.1 -> 1.11, 3.28e-3;
# 0.2 -> 0.93, 2.96e-3.  Monotone in both, so 0.2 is the default.
drift_bootstrap_t_clip = 0.2

# "SBsquared*" only: zero the recovered drift where the marginals carry no mass.
# b = 2γ∇g_t is a LOG-potential gradient, so outside the shock cone — where the
# density sits at its background floor and the IPFP leaves g unconstrained — it is
# pure amplified noise, and the bootstrap re-amplifies it every stage.  Measured
# without the mask (h0.025, γ=1e-4): |β|_max = 2.55 in two lobes in the VOID
# against a true shock displacement of 0.0074, bias_T_max 0.495 (vs FFD 0.042),
# Pe 1179 (vs 204), and a visibly smeared reconstruction.  Heat-smoothing does
# NOT fix it — the artefact is large-scale, not high-frequency.
# w = ρ/(ρ + ρ_ref), ρ = max(μ0,μ1), ρ_ref = the mask_pct-th percentile of ρ.
# Persist the reconstructed Mach/pressure fields to fields.npz alongside
# metrics.json.  Without it a finished run keeps only per-frame PNGs, so
# animations, side-by-side comparison on a shared colour scale, and shock-locus
# overlays have nothing to re-read.  float32; ~2.7 MB at h0.025, ~10.7 MB at
# h0.0125.  Set false if disk is tight.
save_fields = true

drift_bootstrap_mask     = true
drift_bootstrap_mask_pct = 50.0

# Run the FFD registration even when it is NOT driving the kernel, purely to
# populate the γ-independent "FFD" control interpolator in the error tables.
# Keeps SBsquared/oblique runs three-way comparable (BaryCDI vs Linear vs FFD)
# with the drift_ffd runs.  Ignored when reference_drift = "ffd" (always on) or
# "null".  Costs one registration: mesh-independent, 144² grid, 800 Adam iters.
ffd_control = true

drift_sigma_w   = 0.2        # Gaussian shock-band half-width (localization length)
drift_gamma_gas = 1.4        # ratio of specific heats for the θ-β-M relation
drift_cfl_adv   = 0.5        # advective CFL for the Q/Q† FVM solve
sensor_p   = 2        # exponent in |φ − median(φ)|^p for shock density
n_frames   = 11
num_iter   = 1000          # Anderson IPFP iteration cap
anderson_m = 5              # Anderson acceleration memory window (0 = plain Sinkhorn)
debug_ipfp = false          # true → run the plain-Sinkhorn calibration tool instead of the pipeline
ipfp_cfl   = 0.5           # CFL for the FVM heat solve inside IPFP (SSP-RK2 stable up to 1.0)
# IPFP stopping tolerance on the L∞ potential increment max|f_new − f|.  This is
# an UNNORMALISED max over N cells, so a finer mesh samples the shock and the
# wedge corner more densely and reports a larger residual for the same physical
# state — expect to relax this on refined meshes.  metrics.json also records an
# area-weighted RMS residual (residual_l2_history) to tell the two apart.
ipfp_tol   = 1e-7


# Heat-equation smoothing applied to the raw density before IPFP
# For "mask": smooths the sensor weights.  For all other modes: post-processing.
smooth_heat  = true         # false → skip smoothing (faster, rawer densities)
smooth_gamma = 0.1          # diffusion coefficient γ
smooth_t     = 0.001        # final time t  (σ = √(2γt) ≈ 0.032 for defaults)

# Wasserstein-2 error vs. reference (debiased entropic OT via convolutional Sinkhorn)
compute_w2  = true          # false → skip W₂, report only L2/L∞ (much faster)
wass_gamma  = 0.005         # OT regularization γ (σ = √(2γ) ≈ 0.100)
wass_iter   = 50            # Sinkhorn iterations (50 sufficient for rank-ordering)

# Shock-density (marginal) construction. One of:
#   "mask"      — legacy Ducros-sensor weighted density, heat-smoothed     → outputs/Mach_interpolation/ducros/
#   "screened"  — screened-Poisson (ROF) shock-anchored inpainting         → outputs/Mach_interpolation/denoising/screened/
#   "tv"        — total-variation shock-anchored inpainting                → outputs/Mach_interpolation/denoising/tv/
#   "iso"       — Gaussian ridges on Mach iso-contour lines (gated by      → outputs/Mach_interpolation/iso/
#                 Ducros sensor); see iso_n_contours / iso_ducros_pct
#   "isocurve"  — thin PCA-fitted ridge along the Ducros iso-curve         → outputs/Mach_interpolation/isocurve/
#   "iso_hessian" — Alauzet–Loseille Hessian metric node density           → outputs/Mach_interpolation/iso/hessian/
#   "field"     — whole-field marginal (|M-M∞| or ‖∇M‖), see field_source  → outputs/Mach_interpolation/field/
density_mode    = "iso_hessian"
density_pct     = 92.0      # percentile for the shock trust ramp / iso-curve threshold
density_decay   = 0.05      # off-shock decay length ℓ for screened/TV inpainting
tv_weight       = 1.0       # TV term weight when density_mode = "tv"
density_target  = "unit"    # "unit" (shock indicator) or "sensor" (keep sensor magnitude)

# density_mode = "iso" only
iso_n_contours  = 6         # number of equispaced Mach iso-contour lines
iso_ducros_pct  = 50.0      # only look at contours where Ducros > this percentile

# density_mode = "isocurve" only
isocurve_order = 1          # 1 = straight shock (diamond), 2 = quadratic (bump)
isocurve_sigma = 0.0        # ridge half-width; 0 = auto (1.5x median cell size)

# density_mode = "iso_hessian" only  (Alauzet-Loseille metric node density)
hessian_lp   = 2.0          # L^p exponent; rho proportional (det|H|)^{p/(2p+2)}. inf->shocks only, 1->fans kept
hessian_mode = "eig"        # "det" = (det|H|) node density; "eig" = |lambda_max| feature strength
                            # NOTE: use "eig" for the reference-drift A/B — "det" collapses on the
                            # straight diamond legs, leaving no mass on the shocks β is meant to move.
                            # shocks (diamond). 0 = pure determinant (vanishes on straight shocks);
                            # 0.1–0.3 gives det a transportable marginal. Ignored by "eig".

# density_mode = "field" only
field_source    = "grad_mach"  # pert_mach |M-M∞|, pert_p, grad_mach ‖∇M‖, grad_p, combo
field_floor_pct = 50.0         # percentile subtracted to remove the freestream baseline
# FFD-registration drift parameters (reference_drift = "ffd").
# MUST live under [run.mach.drift.ffd] — main.py reads cmach["drift"]["ffd"].
# A top-level [drift.ffd] is silently ignored (main.py raises on it).
[run.mach.drift.ffd]
grid_n = 144
n_cp = [10, 10]                  # Bernstein lattice (degree = n_cp − 1)
alpha_algn = 1.0
alpha_bij = 0.1
alpha_jac = 1.0
alpha_cp_norm = 1e-2
alpha_w2 = 0.1                   # global capture term — your W2 moment cost
barrier_epsilon = 0.1
barrier_fn = "logarithmic"
smooth_extra_cells = 2.0
n_iters = 800
lr = 1e-2

# ---------------------------------------------------------------------------
# Case-specific paths
# ---------------------------------------------------------------------------
[run.mach.diamond]
bundle0      = "results/diamond/h0.025/AOA0.00_M2.00_HLLC_MUSCL_SRK2_t4.00.npz"
bundle1      = "results/diamond/h0.025/AOA0.00_M2.50_HLLC_MUSCL_SRK2_t4.00.npz"
mesh         = "meshes/diamond/diamond_h0.025.npy"
mach0_inlet  = 2.0    # freestream Mach for bundle0
mach1_inlet  = 2.5    # freestream Mach for bundle1
ref_bundles = [
    "results/diamond/h0.025/AOA0.00_M2.05_HLLC_MUSCL_SRK2_t4.00.npz",
    "results/diamond/h0.025/AOA0.00_M2.10_HLLC_MUSCL_SRK2_t4.00.npz",
    "results/diamond/h0.025/AOA0.00_M2.15_HLLC_MUSCL_SRK2_t4.00.npz",
    "results/diamond/h0.025/AOA0.00_M2.20_HLLC_MUSCL_SRK2_t4.00.npz",
    "results/diamond/h0.025/AOA0.00_M2.25_HLLC_MUSCL_SRK2_t4.00.npz",
    "results/diamond/h0.025/AOA0.00_M2.30_HLLC_MUSCL_SRK2_t4.00.npz",
    "results/diamond/h0.025/AOA0.00_M2.35_HLLC_MUSCL_SRK2_t2.74.npz",
    "results/diamond/h0.025/AOA0.00_M2.40_HLLC_MUSCL_SRK2_t4.00.npz",
    "results/diamond/h0.025/AOA0.00_M2.45_HLLC_MUSCL_SRK2_t4.00.npz",
]

[run.mach.bump]
bundle0      = "results/bump/h0.025/M2.00_HLLC_MUSCL_SRK2_t4.00.npz"
bundle1      = "results/bump/h0.025/M2.50_HLLC_MUSCL_SRK2_t4.00.npz"
mesh         = "meshes/bump/bump_h0.025.npy"
mach0_inlet  = 2.0   # freestream Mach for bundle0
mach1_inlet  = 2.5   # freestream Mach for bundle1
ref_bundles = [
    "results/bump/h0.025/M2.05_HLLC_MUSCL_SRK2_t4.00.npz",
    "results/bump/h0.025/M2.10_HLLC_MUSCL_SRK2_t4.00.npz",
    "results/bump/h0.025/M2.15_HLLC_MUSCL_SRK2_t4.00.npz",
    "results/bump/h0.025/M2.20_HLLC_MUSCL_SRK2_t4.00.npz",
    "results/bump/h0.025/M2.25_HLLC_MUSCL_SRK2_t4.00.npz",
    "results/bump/h0.025/M2.30_HLLC_MUSCL_SRK2_t4.00.npz",
    "results/bump/h0.025/M2.35_HLLC_MUSCL_SRK2_t4.00.npz",
    "results/bump/h0.025/M2.40_HLLC_MUSCL_SRK2_t4.00.npz",
    "results/bump/h0.025/M2.45_HLLC_MUSCL_SRK2_t4.00.npz",
]