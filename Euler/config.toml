# Cas test: "bump" | "diamond"
case = "bump"

# Physique
rho_inf = 1.0
p_inf = 1.0
Mach = 2.10
gamma = 1.4
aoa = 0.0

# Solveur
# time_scheme: "EE" | "RK2" | "RK4" | "SRK2" | "SSP_RK2"
time_scheme = "SRK2"
# flux: "Rusanov" | "Tadmor" | "AUSM" | "Roe" | "HLLC"
flux = "HLLC"
# reconstruction: "constant" | "MUSCL"
reconstruction = "MUSCL"
CFL = 0.6
tf = 4.0
stationarity_threshold = 2e-6
stationarity_check_every = 100

# Maillage
mesh_path = "meshes/bump/bump_h0.025.npy"

[export]
# results: true/false
results = false
# figures: false | [] pour rien exporter, sinon liste de champs parmi
# "rho", "u", "v", "p", "M", "S"
figures = ["M"]
graph = false
summary = false
bundle = true
# Nombre de snapshots exportés si on active les figures/bundle/results
n_snaps = 1
